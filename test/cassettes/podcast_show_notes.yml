        \       <title>The AI trade is down even as most stocks are way up.</title>\n
        \       <itunes:title>The AI trade is down even as most stocks are way up.</itunes:title>\n
        \       <link>https://saxostrats.podbean.com/e/the-ai-trade-is-down-even-as-most-stocks-are-way-up/</link>\n
