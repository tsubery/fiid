        isPermaLink=\"false\">saxostrats.podbean.com/7b45a422-9d5f-31e1-b65e-6e931f1702e8</guid>\n
        \                                   <description><![CDATA[<p>Today, we look
        at the remarkable US equity market session yesterday, as the market fears
        that the Democratic mid-term sweep will slow the pace of data centre buildouts,
        sending data center infrastructure and chip companies into a tailspin even
        as the broader market rallied steeply. How durable is this trade? Also, further
        thoughts on the implications of the US mid-terms, macro and FX developments
        and much more. Today's pod is hosted by Saxo Global Head of Macro Strategy
        John J. Hardy.</p>\n<p>Links</p>\n<ul>\n<li>The FT looks at <a href='https://www.ft.com/content/a7fe8e95-bd9a-4cd7-a308-f156073cd074?syn-25a6b1a6=1'>the
        slate of candidates most likely to jostle to the front for a 2028 US Presidential
        Election run</a>.</li>\n<li>Lee Hepner breaks down <a href='https://www.thebignewsletter.com/p/ten-things-to-know-about-this-crushing'>the
        historic mid-term election, arguing what it was and what it wasn't</a> while
        pulling out some interesting subplots and specific developments.</li>\n<li>Michael
        Every says <a href='https://x.com/TheMichaelEvery/status/2118096653727273057'>beware
        of drawing too many conclusions on the direction the Iran conflict may take
        from here</a> based on the post mid-term election vibe shift in energy markets.</li>\n<li>Brent
        Johnson takes <a href='https://x.com/SantiagoAuFund/status/2117987096883335222'>the
        view that this election won't change the march of history towards...</a> What
        exactly? A great American empire not democratic republic? Is that what we
        are supposed to infer from the ancient Rome timeline.</li>\n<li>By the way,
        speaking of ancient Rome's march to empire, <a href='https://open.spotify.com/episode/1u6Iq4g2VC3xkOxA6hWBJR'>the
        Marius and Sulla episode on the great The Rest is History podcast</a> is riveting
        stuff. </li>\n</ul>\n<p>Read daily in-depth market updates from the Saxo Market
        Call and the Saxo Strategy Team <a href='https://www.home.saxo/insights'>here</a>.</p>\n<p>Please
        reach out to us at <a href='mailto:marketcall@saxobank.com'>marketcall@saxobank.com</a>
        for feedback and questions.</p>\n<p><a href='http://goto.saxo/MarketCallSignup'>Click
        here to open an account with Saxo</a>.</p>\n<p>Intro music by <a href='https://soundcloud.com/ashamaluevmusic'>AShamaluevMusic</a></p>\n<p>DISCLAIMER\nThis
        content is marketing material.\nTrading financial instruments carries risks.
        Always ensure that you understand these risks before trading. This material
        does not contain investment advice or an encouragement to invest in a particular
        manner. Historic performance is not a guarantee of future results. The instrument(s)
        referenced in this content may be issued by a partner, from whom Saxo Bank
        A/S receives promotional fees, payment or retrocessions. While Saxo may receive
        compensation from these partnerships, all content is created with the aim
        of providing clients with valuable information and options</p>\n]]></description>\n
