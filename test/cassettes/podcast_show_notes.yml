        isPermaLink=\"false\">saxostrats.podbean.com/cd6cf50a-01e9-3e81-adcd-276a60835903</guid>\n
        \                                   <description><![CDATA[<p>Today we look
        at the massive rebuke of Trump and the Republicans across the US as the Senate,
        House and Governors' races across the nation tilted far more strongly to the
        Democrats than almost anyone was prognosticating. We note how the market is
        absorbing the news and look at what matters next for markets and how they
        will interact with the coming political cycle as well as the immediate aftermath
        of this historic election. Today's pod hosted by Saxo Global Head of Macro
        Strategy John J. Hardy.</p>\n<p>Read daily in-depth market updates from the
        Saxo Market Call and the Saxo Strategy Team <a href='https://www.home.saxo/insights'>here</a>.</p>\n<p>Please
        reach out to us at <a href='mailto:marketcall@saxobank.com'>marketcall@saxobank.com</a>
        for feedback and questions.</p>\n<p><a href='http://goto.saxo/MarketCallSignup'>Click
        here to open an account with Saxo</a>.</p>\n<p>Intro music by <a href='https://soundcloud.com/ashamaluevmusic'>AShamaluevMusic</a></p>\n<p>DISCLAIMER\nThis
